# Signed + notarized + stapled DMG, attached to a GitHub Release.
#
# pyproject.toml's `version` is the single source of truth (no more
# tag-patches-pyproject at build time):
#   - A PR that changes shipped files must bump it (job `version-bumped`).
#   - A push to master reads it, and if `v<version>` isn't tagged yet, tags
#     the pushed commit, builds/signs/notarizes/staples the DMG, and creates
#     the GitHub Release with that DMG attached — all in this one job.
#     (A GITHUB_TOKEN-created tag does not fire `on: push: tags`, so the
#     build can't live in a separate tag-triggered job the way it used to.)
#   - workflow_dispatch re-runs the same release job, restricted to master,
#     for retrying a build/notarize/publish failure on a version that's
#     already merged, without needing a new bump.
#   - A PEP 440 pre-release version (0.2.0b1, 0.2.0rc1) is published as a
#     GitHub prerelease, so releases/latest stays on the last final version.
#     Pre-releases may be dispatched from any branch: that is how a PR gets
#     a signed, notarized beta DMG before it merges.
#
# Reuses scripts/build_app.sh as-is — the only thing CI sets up that the
# script can't is the `voitta-notary` keychain profile (locally created via
# `notarytool store-credentials`, in CI created from secrets each run).
name: release

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    paths-ignore:
      - '.github/**'
      - '**.md'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  VERSION_FILE: pyproject.toml

jobs:
  version-bumped:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Version must advance
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          pip install -q packaging
          git fetch --no-tags --depth=1 origin "$BASE"
          old=$(git show "FETCH_HEAD:$VERSION_FILE" 2>/dev/null | grep -m1 -E '^version = ' | sed -E 's/^version = "([^"]+)"/\1/' || true)
          if [ -z "$old" ]; then
            echo "::error::Could not read a version from $VERSION_FILE at $BASE (file missing or unparsable there)."
            exit 1
          fi
          new=$(grep -m1 -E '^version = ' "$VERSION_FILE" | sed -E 's/^version = "([^"]+)"/\1/' || true)
          if [ -z "$new" ]; then
            echo "::error::Could not read a version from $VERSION_FILE on this branch."
            exit 1
          fi
          if [ "$old" = "$new" ]; then
            echo "::error::$VERSION_FILE version is still $old - bump it."
            exit 1
          fi
          # PEP 440 order, as briefcase uses. `sort -V` ranks 0.2.0 below
          # 0.2.0b1, so a beta could never be followed by its release.
          # Canonical spelling only: briefcase names the DMG after the
          # normalized version, while the tag and Info.plist take it verbatim.
          python - "$old" "$new" <<'EOF'
          import sys
          from packaging.version import InvalidVersion, Version

          def fail(msg):
              print(f"::error::{msg}")
              sys.exit(1)

          old, new = sys.argv[1], sys.argv[2]
          try:
              parsed = Version(new)
          except InvalidVersion:
              fail(f"{new} is not a PEP 440 version.")
          if str(parsed) != new:
              fail(f"Spell the version {parsed}, not {new}.")
          if parsed <= Version(old):
              fail(f"{new} does not advance past {old}.")
          print(f"{old} -> {new}")
          EOF

  release:
    if: github.event_name != 'pull_request'
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      contents: write  # gh release create/upload needs this
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and tag
        id: ver
        run: |
          set -euo pipefail
          version=$(grep -m1 -E '^version = ' "$VERSION_FILE" | sed -E 's/^version = "([^"]+)"/\1/' || true)
          if [ -z "$version" ]; then
            echo "::error::Could not read a version from $VERSION_FILE."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" =~ (a|b|rc)[0-9]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restrict final releases to master
        # workflow_dispatch lets a maintainer pick any ref in the UI; push
        # is already filtered to master by the trigger above, so this is a
        # no-op there. Without this, a stale/recovery branch could get
        # signed, notarized, and published as a public release. Pre-releases
        # are exempt: they never become "Latest".
        run: |
          set -euo pipefail
          if [ "${{ github.ref }}" != "refs/heads/master" ] && [ "${{ steps.ver.outputs.prerelease }}" != "true" ]; then
            echo "::error::Only pre-release versions (e.g. 0.2.0b1) may be released from ${{ github.ref }}; ${{ steps.ver.outputs.version }} must be released from refs/heads/master."
            exit 1
          fi

      - name: Skip only if the release already has its DMG
        # Distinguish "fully released" from "release exists but the DMG
        # upload never completed" (e.g. a prior run died between creating
        # the release and attaching the asset). Only the former skips the
        # build; the latter falls through and re-runs it, then the publish
        # step below uploads onto the existing release instead of trying
        # (and failing) to create it again.
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -q '\.dmg$'; then
            echo "$TAG already has a DMG asset; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: '3.12'

      - name: Import Developer ID certificate
        if: steps.gate.outputs.skip != 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$CERT_P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          # Make our temp keychain the only one in the search list so
          # codesign doesn't pick up some stale identity.
          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          # Grant codesign access without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          rm -f "$CERT_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Configure notarytool credentials
        if: steps.gate.outputs.skip != 'true'
        env:
          API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$API_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          # Two profiles needed:
          #   • voitta-notary               — used by scripts/build_app.sh's
          #     explicit `xcrun notarytool submit` block.
          #   • briefcase-macOS-<TEAM_ID>   — used by `briefcase package`
          #     internally when --identity is passed (briefcase derives the
          #     name from the team-id parsed out of the signing identity).
          # Same credentials, two names.
          TEAM_ID=$(printf '%s' "$SIGN_IDENTITY" | sed -E 's/.*\(([A-Z0-9]+)\).*/\1/')
          for PROFILE in voitta-notary "briefcase-macOS-${TEAM_ID}"; do
            xcrun notarytool store-credentials "$PROFILE" \
              --key "$KEY_PATH" \
              --key-id "$API_KEY_ID" \
              --issuer "$API_ISSUER_ID" \
              --keychain "$RUNNER_TEMP/build.keychain"
          done
          rm -f "$KEY_PATH"

      - name: Setup venv
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt briefcase

      - name: Build, sign, notarize, staple
        if: steps.gate.outputs.skip != 'true'
        env:
          VOITTA_NOTARY_PROFILE: voitta-notary
        run: |
          set -euo pipefail
          ./scripts/build_app.sh --package \
            --sign "${{ secrets.MACOS_SIGN_IDENTITY }}" \
            --notarize

      - name: Locate DMG
        if: steps.gate.outputs.skip != 'true'
        id: dmg
        run: |
          set -euo pipefail
          DMG=$(ls -1 dist/*.dmg | head -1)
          test -n "$DMG"
          echo "path=$DMG" >> "$GITHUB_OUTPUT"

      - name: Verify Gatekeeper acceptance
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          spctl -a -vv --type install "${{ steps.dmg.outputs.path }}"

      - name: Tag and publish GitHub Release
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          DMG="${{ steps.dmg.outputs.path }}"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG exists without its DMG; uploading onto it."
            gh release upload "$TAG" "$DMG" --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" \
              --title "Voitta Desktop $TAG" \
              --generate-notes \
              --target "$GITHUB_SHA" \
              --prerelease="${{ steps.ver.outputs.prerelease }}" \
              "$DMG"
          fi
