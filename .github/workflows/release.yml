# Signed + notarized + stapled DMG, attached to a GitHub Release.
#
# Triggered by pushing a v* tag (e.g. `git tag v0.1.1 && git push --tags`).
# The tag's version (minus leading `v`) is patched into pyproject.toml at
# build time, so briefcase produces a correctly-named DMG without requiring
# a manual version bump commit.
#
# Reuses scripts/build_app.sh as-is — the only thing CI sets up that the
# script can't is the `voitta-notary` keychain profile (locally created via
# `notarytool store-credentials`, in CI created from secrets each run).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.1). Must already exist as a git tag.'
        required: true

permissions:
  contents: write  # gh release create needs this

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync version from tag
        # Tag v0.1.1 → version "0.1.1" in pyproject.toml. Done in-runner so
        # the repo doesn't need a tag-bump commit. BSD sed (-i '') is the
        # macOS-runner flavour.
        run: |
          TAG="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          VERSION="${TAG#v}"
          /usr/bin/sed -i '' -E "s/^version = \"[^\"]+\"/version = \"${VERSION}\"/" pyproject.toml
          grep '^version' pyproject.toml

      - name: Import Developer ID certificate
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$CERT_P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          # Make our temp keychain the only one in the search list so
          # codesign doesn't pick up some stale identity.
          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          # Grant codesign access without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          rm -f "$CERT_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Configure notarytool credentials
        env:
          API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$API_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          # Profile name "voitta-notary" matches build_app.sh's default.
          xcrun notarytool store-credentials voitta-notary \
            --key "$KEY_PATH" \
            --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER_ID" \
            --keychain "$RUNNER_TEMP/build.keychain"
          rm -f "$KEY_PATH"

      - name: Setup venv
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt briefcase

      - name: Build, sign, notarize, staple
        env:
          VOITTA_NOTARY_PROFILE: voitta-notary
        run: |
          ./scripts/build_app.sh --package \
            --sign "${{ secrets.MACOS_SIGN_IDENTITY }}" \
            --notarize

      - name: Locate DMG
        id: dmg
        run: |
          DMG=$(ls -1 dist/*.dmg | head -1)
          test -n "$DMG"
          echo "path=$DMG" >> "$GITHUB_OUTPUT"

      - name: Verify Gatekeeper acceptance
        run: spctl -a -vv --type install "${{ steps.dmg.outputs.path }}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          gh release create "$TAG" \
            --title "Voitta Desktop $TAG" \
            --generate-notes \
            "${{ steps.dmg.outputs.path }}"
