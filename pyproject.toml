# Briefcase manifest for Voitta Desktop.
#
# This file is briefcase-only; runtime deps for terminal dev still come from
# requirements.txt. `scripts/build_app.sh` cd's here before invoking briefcase,
# which writes build/ and dist/ next to this manifest (the repo root).

[tool.briefcase]
project_name = "Voitta Desktop"
bundle = "ai.voitta"
version = "0.1.16"
url = "https://voitta.ai"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
author = "Voitta"
author_email = "info@voitta.ai"

[tool.briefcase.app.voitta_desktop]
# `formal_name` is the .app filename ("Voitta Desktop.app").
# `app_name` (table key, "voitta_desktop") is the Python package slug under
# src/voitta_desktop/ and the build dir slug under build/voitta_desktop/.
formal_name = "Voitta Desktop"
description = "Menu-bar LLM proxy + MCP aggregator. Tracks conversations, optimizes context, unifies RAG/Google/Jira behind one MCP endpoint."
icon = "images/AppIcon"
long_description = """
Voitta Desktop is a macOS menu-bar app that runs two local proxies:

  • LLM Proxy — intercepts Claude API calls, optimizes context (image
    stripping, stale file-read removal, bash output compression),
    visualizes per-conversation token usage and savings, and routes each
    Claude Code window to a Claude or ChatGPT subscription or an API-key
    provider (DeepSeek, Mistral, ...).

  • MCP Auth Proxy — single FastMCP endpoint that aggregates RAG, Google
    Workspace, Jira, and other backends with automatic OAuth2 injection.
"""

# Paths are relative to this pyproject.toml. The shim package
# src/voitta_desktop/ provides the entry point; everything else is the
# existing root-level layout — no restructure required for briefcase.
sources = [
    "src/voitta_desktop",
    "app.py",
    "config.py",
    "claude_link.py",
    # Root modules are listed one by one, not globbed — a new one that isn't
    # added here is simply absent from the bundle and the app dies on import.
    # Keep this list equal to `ls *.py`; scripts/check_bundle.py enforces it.
    "app_base.py",
    "paths.py",
    "runtime.py",
    "lifecycle.py",
    "auth",
    "llmgw",
    "mcpproxy",
    "middleware",
    "optimizers",
    "proxy",
    "ui",
    "images",
]

# Run-time Python deps shipped INSIDE the .app bundle.
requires = [
    # Menu bar UI — rumps is sdist-only on PyPI; briefcase passes
    # --only-binary :all: to pip so we point at a locally pre-built
    # wheel under wheels/. build_app.sh rebuilds it on first run.
    "./wheels/rumps-0.4.0-py3-none-any.whl",

    # macOS native UI bindings
    "pyobjc-framework-Cocoa>=10.0",
    "pyobjc-framework-WebKit>=10.0",

    # LLM reverse proxy
    "aiohttp>=3.9.0",

    # MCP unified proxy
    # Exact pin, and requirements.txt must match it. Two separate incidents:
    #   * 4.x moved to the renamed "httpx2" package and mcp 2.x — a clean
    #     build on 2026-09-13 resolved 4.0.3 and the MCP proxy died on import,
    #     so the range became <4.
    #   * <4 then resolved 3.4.7 into the bundle while the dev venv still had
    #     3.1.1. 3.4.7's ProxyProvider._get_tool reads a private cache our
    #     provider never fills, so every proxied tool call failed with
    #     "Unknown tool" while listings kept working — invisible to a test
    #     suite running against 3.1.1 (see tests/test_proxied_tool_calls.py).
    # A range across a library we subclass buys nothing and hides breakage;
    # upgrade deliberately, with the suite running on the new version.
    "fastmcp==3.4.7",
    # mcpproxy/server.py imports httpx directly; declare it rather than rely
    # on it arriving transitively through fastmcp.
    "httpx>=0.27",

    # OAuth2
    "msal>=1.28.0",
    "requests>=2.31.0",

    # Terminal UI
    "textual>=0.70.0",

    # Config + image processing
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
    "Pillow>=10.0",

    # Anthropic serves error bodies (and can serve any response) with
    # Content-Encoding: br — middleware/base.decompress() hard-requires
    # brotli for those, and without it every 400 dump is unreadable noise.
    "brotli>=1.1.0",

    # CA bundle — briefcase's standalone Python ships no system root CAs,
    # so aiohttp's TLS handshake to api.anthropic.com fails with
    # "unable to get local issuer certificate" inside the bundle. app.py
    # wires SSL_CERT_FILE → certifi.where() before any TLS connection.
    "certifi>=2024.2.2",
]

[tool.briefcase.app.voitta_desktop.macOS]
# arm64 only — universal2 doubles bundle size for no value here.
universal_build = false
# Sonoma is Apple's current security floor and matches our pyobjc/rumps tests.
min_os_version = "14.0"
# Menu-bar app — no Dock icon.
info."LSUIElement" = true
info."NSHumanReadableCopyright" = "Copyright (c) 2026 Voitta. AGPLv3."

# ── Hardened runtime entitlements ────────────────────────────────────────
# Required for Apple notarisation. No effect on ad-hoc builds; macOS only
# enforces them when signed with a Developer ID and launched from Gatekeeper.
#
# Why each is needed for a Python app:
#   • allow-jit, allow-unsigned-executable-memory — Python's interpreter and
#     several C extensions mprotect RWX pages or mmap executable mappings.
#   • disable-library-validation — we vendor C extensions (pyobjc, Pillow)
#     signed by their wheel builders, not us. Default library validation
#     would refuse to load them.
#   • allow-dyld-environment-variables — briefcase's launcher uses
#     DYLD_FRAMEWORK_PATH so the bundled Python.framework wins over system.
entitlement."com.apple.security.cs.allow-jit" = true
entitlement."com.apple.security.cs.allow-unsigned-executable-memory" = true
entitlement."com.apple.security.cs.disable-library-validation" = true
entitlement."com.apple.security.cs.allow-dyld-environment-variables" = true

# Voitta Desktop is a network app — these aren't strictly entitlements
# under hardened runtime (no sandbox), but they're harmless to advertise.
# Keeping the network keys here as a marker for future App-Sandbox attempts.
